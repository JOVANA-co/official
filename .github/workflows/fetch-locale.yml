name: Fetch Google Sheet Translations

on:
  workflow_dispatch: # 手動執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Fetch from Google Sheets
        run: |
          export GOOGLE_SERVICE_ACCOUNT_BASE64=${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
          export GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          pnpm run locale:fetch

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "ci: update i18n from Google Sheet"
          git push
